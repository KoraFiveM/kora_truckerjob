name: Bug Report
description: Report a reproducible problem in kora_truckerjob.
title: '[Bug]: '
labels:
- bug
- needs-triage
body:
- type: dropdown
  id: resource
  attributes:
    label: Affected component
    options:
    - Freight contracts
    - Truck and trailer assignment
    - Delivery rewards
    - Skills and fleet
    - Other
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: kora_truckerjob version or commit
    placeholder: Version or Git commit SHA
  validations:
    required: true
- type: textarea
  id: description
  attributes:
    label: What happened?
    description: Describe what happened in kora_truckerjob and which action triggered it.
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    placeholder: List the setup, the action you took, and when the problem occurred.
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected behavior
  validations:
    required: true
- type: textarea
  id: logs
  attributes:
    label: Logs, screenshots or clips
    description: Remove tokens, passwords, IP addresses and other private data before posting.
    render: shell
- type: checkboxes
  id: checks
  attributes:
    label: Checklist
    options:
    - label: I searched existing issues for duplicates.
      required: true
    - label: I removed sensitive information from my report.
      required: true
